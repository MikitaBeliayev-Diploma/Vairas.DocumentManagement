name: Verify Document Management
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and test against PostgreSQL and real file infrastructure
        shell: pwsh
        run: ./scripts/verify.ps1 -IncludeInfrastructure -IncludeRender
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-management-evidence
          path: |
            evidence/
            .evidence/render/
